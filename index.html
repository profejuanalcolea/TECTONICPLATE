<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tectònica de plaques</title>
<style>
:root{
  --ink:#111; --paper:#fff; --or:#f07c1b; --or-l:#fde3cc; --grey:#6b6b6b; --line:#d8d8d8;
  --c-dorsal:#1f6fd1; --c-sub:#d62828; --c-col:#7a1f3d; --c-tra:#46b85a; --c-dif:#8a8a8a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.app{display:flex;flex-direction:column;height:100vh;min-height:560px}
header{display:flex;align-items:center;gap:24px;padding:10px 22px;border-bottom:4px solid var(--or)}
header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.2px}
header h1 span{color:var(--or)}
nav.tabs{display:flex;gap:6px;margin-left:auto}
nav.tabs button{font:inherit;font-size:19px;font-weight:700;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 18px;border-radius:999px;cursor:pointer}
nav.tabs button.on{background:var(--ink);color:#fff}
nav.tabs button:hover:not(.on){background:var(--or-l)}
main{flex:1;min-height:0;position:relative}
section.tab{position:absolute;inset:0;display:none;padding:12px 18px 8px}
section.tab.on{display:flex;gap:16px}
.mapcol{flex:2.15;display:flex;flex-direction:column;min-width:0}
.side{flex:0 0 400px;border-left:3px solid var(--ink);padding:4px 4px 4px 18px;overflow:auto;font-size:18px;line-height:1.45}
.side h2{font-size:26px;margin:2px 0 6px}
.side h3{font-size:19px;margin:14px 0 4px;color:var(--or)}
.side p{margin:6px 0}
.side .kicker{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--grey)}
.side ul{margin:4px 0;padding-left:22px}
.side li{margin:3px 0}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
section.tab.wide .side{display:none}
.sidetg{margin-left:6px}
.chip{font:inherit;font-size:16px;font-weight:700;border:2px solid var(--ink);background:#fff;padding:4px 12px;border-radius:8px;cursor:pointer}
.chip.on{background:var(--or);border-color:var(--or);color:#111}
.mapwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
svg.map{width:100%;height:100%;display:block;background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;padding:6px 2px 0;align-items:center}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .simpl{display:flex;align-items:center;gap:7px;font-weight:800;font-size:16px;border:2px solid var(--or);border-radius:8px;padding:3px 10px;cursor:pointer;background:var(--or-l)}
.legend .simpl input{width:18px;height:18px;accent-color:#111;cursor:pointer}
.btn{font:inherit;font-size:16px;font-weight:700;border:none;background:var(--ink);color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;margin-top:8px}
.btn:hover{background:var(--or);color:#111}
.tag{display:inline-block;font-size:15px;font-weight:700;padding:2px 9px;border-radius:6px;color:#fff;margin:2px 0}
footer{font-size:12.5px;color:var(--grey);padding:4px 22px 6px;border-top:1px solid var(--line)}
/* map styles */
.land{fill:#dcdcdc;stroke:#b5b5b5;stroke-width:.35;pointer-events:none}
.plate{fill:transparent;cursor:pointer}
.plate:hover{fill:rgba(240,124,27,.16)}
.plate.sel{fill:rgba(240,124,27,.38)}
.bd{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.bd.dorsal{stroke:var(--c-dorsal);stroke-width:2.7}
.bd.dorsal2{stroke:#fff;stroke-width:.9}
.bd.rift{stroke:var(--c-dorsal);stroke-width:2;stroke-dasharray:4 2.5}
.bd.subduccio{stroke:var(--c-sub);stroke-width:2}
.bd.collisio{stroke:var(--c-col);stroke-width:2}
.bd.transformant{stroke:var(--c-tra);stroke-width:2}
.bd.difus{stroke:var(--c-dif);stroke-width:1.6;stroke-dasharray:.1 3.2}
.hit{fill:none;stroke:transparent;stroke-width:9;cursor:pointer}
.hit:hover + .hl, .hl.sel{stroke:var(--or);stroke-opacity:.55}
.hl{fill:none;stroke:transparent;stroke-width:8;pointer-events:none;stroke-linecap:round}
.teeth{fill:var(--c-sub);pointer-events:none}
.oteeth{fill:#fff;stroke:var(--c-col);stroke-width:.9;pointer-events:none}
.harrow{fill:none;stroke:#1b6b2a;stroke-width:1.1;pointer-events:none}
.marr{pointer-events:none}
.marr path{fill:#111}
.plabel{font-size:11px;font-weight:800;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:2.6px;text-anchor:middle;pointer-events:none;letter-spacing:.2px}
.plabel.small{font-size:8.5px}
.ctx{cursor:pointer}
.ctx circle{fill:var(--or);stroke:#111;stroke-width:1.4}
.ctx text{font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#111;pointer-events:none}
.ctx:hover circle,.ctx.sel circle{fill:#111}
.ctx:hover text,.ctx.sel text{fill:#fff}
/* limits tab */
#t-limits{flex-direction:row}
.lnav{width:235px;display:flex;flex-direction:column;gap:8px}
.lnav .grp{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--grey);margin-top:8px}
.lnav button{font:inherit;text-align:left;font-size:18px;font-weight:700;border:2px solid var(--ink);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;border-left-width:10px}
.lnav button.on{background:var(--ink);color:#fff}
.lbody{flex:1;display:flex;gap:18px;min-width:0}
.ltext{flex:1;overflow:auto;font-size:17.5px;line-height:1.5;padding-right:6px}
.ltext h2{font-size:28px;margin:0 0 8px}
.ltext dl{margin:0}
.ltext dt{font-weight:800;color:var(--or);margin-top:10px;font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.ltext dd{margin:2px 0 0}
.ldiag{flex:1.75;display:flex;flex-direction:column;min-width:0}
.dframe{flex:1;min-height:0;border:5px solid var(--ink);border-radius:12px;padding:4px;display:flex;align-items:center;justify-content:center;background:#fff}
.dframe svg{width:100%;height:100%}
.dctl{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:16px}
.stages{display:flex;gap:6px}
/* diagram styles */
.dg text{font-family:inherit}
.dg .lab text{font-size:14px;font-weight:700;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:3px}
.dg .lab text.w{fill:#fff;stroke:none}
.dg .lab text.sm{font-size:12px;font-style:italic;font-weight:600}
.dg .lab line,.dg .lab path.ld{stroke:#111;stroke-width:1;fill:none}
.dg.nolab .lab{display:none}
.moho{fill:none;stroke:#111;stroke-width:1;stroke-dasharray:4 3}
.lab-line{stroke:#111;stroke-width:1}
@keyframes mvR{from{transform:translateX(-6px)}to{transform:translateX(10px)}}
@keyframes mvL{from{transform:translateX(6px)}to{transform:translateX(-10px)}}
@keyframes mvU{from{transform:translateY(8px)}to{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes rise{from{transform:translateY(0);opacity:0}20%{opacity:1}to{transform:translateY(-70px);opacity:0}}
.aR{animation:mvR 2.4s ease-in-out infinite alternate}
.aL{animation:mvL 2.4s ease-in-out infinite alternate}
.aU{animation:mvU 2.4s ease-in-out infinite alternate}
.pul{animation:pulse 2.2s ease-in-out infinite}
.flow{stroke-dasharray:10 18;animation:flow 1.6s linear infinite}
.rise{animation:rise 3s linear infinite}
.paused *{animation-play-state:paused!important}
@keyframes outL{from{transform:translateX(0)}to{transform:translateX(-30px)}}
@keyframes outR{from{transform:translateX(0)}to{transform:translateX(30px)}}
.outL{animation:outL 3.5s linear infinite}.outR{animation:outR 3.5s linear infinite}
@keyframes lava{0%,55%{stroke-dashoffset:60;opacity:0}58%{opacity:1}78%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.lava{stroke:#ff5a1f;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:60;stroke-dashoffset:60;opacity:0;animation:lava 7s ease-in infinite}
@keyframes spit{0%,54%{transform:translate(0,0);opacity:0}57%{opacity:1}68%{transform:translate(var(--dx),-20px);opacity:1}80%{transform:translate(calc(var(--dx) * 1.7),-4px);opacity:0}100%{opacity:0}}
.spit{opacity:0;animation:spit 7s ease-out infinite}
svg.map{cursor:grab;touch-action:none}
svg.map.drag{cursor:grabbing}
.zoom{display:inline-flex;gap:4px;margin-left:auto}
.zoom .chip{min-width:44px;font-size:18px;padding:3px 10px}
.note{font-size:15px;color:#333;background:#f5f5f5;border-left:5px solid var(--or);padding:6px 10px;margin:10px 0}
/* contexts */
.fitxa dl{margin:0}
.fitxa dt{font-weight:800;margin-top:9px;font-size:15.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--or)}
.fitxa dd{margin:1px 0 0}
.numlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px}
.numlist button{font:inherit;font-size:16px;text-align:left;background:none;border:none;padding:3px 0;cursor:pointer}
.numlist button b{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--or);text-align:center;line-height:26px;margin-right:6px;border:1.5px solid #111;font-size:14px}
.numlist button:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Tectònica de <span>plaques</span></h1>
  <nav class="tabs">
    <button data-tab="t-map" class="on">Mapa</button>
    <button data-tab="t-limits">Límits</button>
    <button data-tab="t-ctx">Contextos tectònics</button>
  </nav>
</header>
<main>
  <!-- MAPA -->
  <section class="tab on" id="t-map">
    <div class="mapcol">
      <div class="tools">
        <button class="chip on" id="tg-names">Noms de les plaques</button>
        <button class="chip" id="tg-arrows">Moviment relatiu</button>
        <button class="chip" id="tg-reset">Treure la selecció</button>
        <button class="chip sidetg" data-sec="t-map">Amaga el quadre ▸</button>
        <span class="zoom" data-map="map1"><button class="chip" data-z="in" title="Amplia">🔍+</button><button class="chip" data-z="out" title="Redueix">🔍−</button><button class="chip" data-z="all">Mapa sencer</button></span>
      </div>
      <div class="mapwrap"><svg class="map" id="map1"></svg></div>
      <div class="legend" id="legend1"></div>
    </div>
    <aside class="side" id="side1"></aside>
  </section>

  <!-- LÍMITS -->
  <section class="tab" id="t-limits">
    <div class="lnav" id="lnav"></div>
    <div class="lbody">
      <div class="ltext" id="ltext"></div>
      <div class="ldiag">
        <div class="dframe" id="dframe"></div>
        <div class="dctl">
          <button class="chip on" id="d-play">❚❚ Atura</button>
          <button class="chip on" id="d-lab">Etiquetes</button>
          <span class="stages" id="d-stages"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- CONTEXTOS -->
  <section class="tab" id="t-ctx">
    <div class="mapcol">
      <div class="tools"><span style="font-size:17px;font-weight:700">Clica un número del mapa.</span>
        <button class="chip sidetg" data-sec="t-ctx">Amaga el quadre ▸</button>
        <span class="zoom" data-map="map2"><button class="chip" data-z="in" title="Amplia">🔍+</button><button class="chip" data-z="out" title="Redueix">🔍−</button><button class="chip" data-z="all">Mapa sencer</button></span></div>
      <div class="mapwrap"><svg class="map" id="map2"></svg></div>
      <div class="legend" id="legend2"></div>
    </div>
    <aside class="side fitxa" id="side2"></aside>
  </section>
</main>
<footer>J Alcolea · Ins Júlia Minguell · Ciències de la Terra — Fonts: Tarbuck i Lutgens, <i>Ciencias de la Tierra</i>; límits i velocitats de placa: Bird, P. (2003), <i>An updated digital model of plate boundaries</i>, G³; costes: Natural Earth.</footer>
</div>

function arrowShape(x,y,dx,dy,len){

function arrowPair(g,p,t,b){

  if(b.c==='dorsal'||b.c==='rift'){

  } else if(b.c==='subduccio'||b.c==='collisio'){
    add(p[0]+n[0]*(gap+len),p[1]+n[1]*(gap+len),-n[0],-n[1]);

function enableZoom(svg){
  let vb={x:0,y:0,w:W,h:H};
  const apply=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const clamp=()=>{vb.w=Math.min(W,Math.max(W/8,vb.w)); vb.h=vb.w*H/W; vb.x=Math.min(W-vb.w,Math.max(0,vb.x)); vb.y=Math.min(H-vb.h,Math.max(0,vb.y));};

    const ox=(r.width-vb.w*s)/2, oy=(r.height-vb.h*s)/2; return [vb.x+(cx-r.left-ox)/s, vb.y+(cy-r.top-oy)/s, s];};

    if(!moved && Math.hypot(dx,dy)<5) return; moved=true; svg.classList.add('drag');

  window.addEventListener('pointerup',()=>{drag=null; svg.classList.remove('drag');});
  svg.addEventListener('click',e=>{ if(moved){e.stopPropagation();e.preventDefault();moved=false;} },true);
  return {in:()=>zoom(1.6), out:()=>zoom(1/1.6), all:()=>{vb={x:0,y:0,w:W,h:H};apply();}};
}

/* ===================== BLOCS DIAGRAMA ===================== */
const C = {cc:'#e6cd9c', ccT:'#f0ddb6', oc:'#5c636b', ocT:'#8f99a3', ml:'#b9b3a8', ast:'#f39a4a', mag:'#e2361b', sea:'#bfe1f5', seaT:'#d9eef9', shade:'rgba(0,0,0,.16)'};
const DX=60, DY=-40, X0=40, X1=500, YB=350;
const g = u=>Math.exp(-u*u);
const P = pts=>pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const poly=(pts,fill,ex='')=>`<polygon points="${P(pts)}" fill="${fill}" ${ex}/>`;
const pth=(pts)=>'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
const samp=(f,a,b,st=5)=>{const o=[];for(let x=a;x<=b+1e-6;x+=st)o.push([x,f(x)]);if(o[o.length-1][0]<b)o.push([b,f(b)]);return o;};
const off=pts=>pts.map(([x,y])=>[x+DX,y+DY]);
const topFace=(prof,fill)=>poly(prof.concat(off(prof).reverse()),fill,'stroke="rgba(0,0,0,.25)" stroke-width=".6"');
const sideQ=(x,y0,y1,fill)=>poly([[x,y0],[x+DX,y0+DY],[x+DX,y1+DY],[x,y1]],fill)+poly([[x,y0],[x+DX,y0+DY],[x+DX,y1+DY],[x,y1]],C.shade);
const sideBands=(x,bands)=>bands.map(b=>sideQ(x,b[0],b[1],b[2])).join('');
function landOver(sf,SL,fill){ // redibuixa la cara superior de les parts de terra per sobre del nivell del mar
  let runs=[],cur=[];
  for(let i=0;i<sf.length;i++){
    const p=sf[i], up=p[1]<=SL;
    if(i>0){const q=sf[i-1], qu=q[1]<=SL; if(up!==qu){const t=(SL-q[1])/(p[1]-q[1]); const c=[q[0]+t*(p[0]-q[0]),SL]; cur.push(c); if(!up){runs.push(cur);cur=[];} else cur=[c];}}
    if(up) cur.push(p);
  }
  if(cur.length) runs.push(cur);
  return runs.filter(r=>r.length>1).map(r=>topFace(r,fill)).join('');
}
const astFrom=(lb)=>poly(lb.concat([[X1,YB],[X0,YB]]),C.ast);
const T=(x,y,s,cls='',anc='start')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anc}">${s}</text>`;
const Ld=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><circle cx="${x2}" cy="${y2}" r="2.2" fill="#111"/>`;
function arr(x,y,dir,len=46,cls){ // dir: 1 dreta, -1 esquerra
  const w=7,hw=14,hl=16, s=dir;
  const pts=[[x,y-w],[x+s*(len-hl),y-w],[x+s*(len-hl),y-hw],[x+s*len,y],[x+s*(len-hl),y+hw],[x+s*(len-hl),y+w],[x,y+w]];
  return `<g class="${cls||(dir>0?'aR':'aL')}">${poly(pts,'#fff','stroke="#111" stroke-width="2"')}</g>`;
}
function arrV(x,y,dir,len=40){ // dir 1 avall, -1 amunt
  const w=6,hw=12,hl=14,s=dir;
  const pts=[[x-w,y],[x-w,y+s*(len-hl)],[x-hw,y+s*(len-hl)],[x,y+s*len],[x+hw,y+s*(len-hl)],[x+w,y+s*(len-hl)],[x+w,y]];
  return `<g class="aU">${poly(pts,'#fff','stroke="#111" stroke-width="2"')}</g>`;
}
function bracket(x,y0,y1,txt){
  return `<path class="ld" d="M${x+8},${y0}L${x},${y0}L${x},${y1}L${x+8},${y1}"/><text x="${x-6}" y="${(y0+y1)/2}" transform="rotate(-90 ${x-6} ${(y0+y1)/2})" text-anchor="middle">${txt}</text>`;
}
function magma(cx,ytop,yb=YB,w=20){
  const ym=ytop+(yb-ytop)*.45;
  return `<path class="pul" d="M${cx-w*1.6},${yb} C${cx-w*1.6},${ym+30} ${cx-w*.5},${ym} ${cx-5},${ytop+14} Q${cx},${ytop-2} ${cx+5},${ytop+14} C${cx+w*.5},${ym} ${cx+w*1.6},${ym+30} ${cx+w*1.6},${yb} Z" fill="${C.mag}"/>`+
   [0,1,2].map(i=>`<circle class="rise" style="animation-delay:${i}s" cx="${cx}" cy="${yb-20}" r="4" fill="#ffd27a"/>`).join('');
}
const svgWrap=(inner,lab)=>`<svg class="dg" viewBox="0 12 600 368" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="cf"><rect x="${X0}" y="0" width="${X1-X0}" height="${YB}"/></clipPath></defs>${inner}<g class="lab">${lab}</g></svg>`;

/* ---------- 1. Dorsal ---------- */
function dDorsal(){
  const c=270, SL=120;
  const f=x=>185-40*g((x-c)/85)+9*g((x-c)/9);
  const lab_=x=>300-120*g((x-c)/110);
  const sf=samp(f,X0,X1), cb=samp(x=>f(x)+16,X0,X1), lb=samp(lab_,X0,X1);
  let s='';
  // franges que neixen a l'eix i s'allunyen cap als costats (la litosfera creix cap als costats)
  const tf=sf.concat(off(sf).reverse()), lith=sf.concat(lb.slice().reverse());
  const stripes=(side,y0,y1,dy)=>{let o='';for(let k=0;k<12;k++){const x=c+side*k*30;o+=`<line x1="${x}" y1="${y0}" x2="${x+dy*DX}" y2="${y1+dy*DY}" stroke="rgba(255,255,255,.55)" stroke-width="5"/>`;}return o;};
  s+=`<defs><clipPath id="ctf"><polygon points="${P(tf)}"/></clipPath><clipPath id="clith"><polygon points="${P(lith)}"/></clipPath>
      <clipPath id="cL"><rect x="0" y="0" width="${c}" height="400"/></clipPath><clipPath id="cR"><rect x="${c}" y="0" width="600" height="400"/></clipPath>
      <clipPath id="cLt"><polygon points="${c},0 ${c+DX*2},${-DY*-2} ${c+DX*3},400 0,400 0,0"/></clipPath></defs>`;
  s+=topFace(sf,C.ocT);
  // franges a la cara superior (paral·leles a l'eix)
  const topStr=(side)=>{let o='';for(let k=0;k<12;k++){const x=c+side*k*30;o+=poly([[x-4,f(x)],[x+4,f(x)],[x+4+DX,f(x)+DY],[x-4+DX,f(x)+DY]],'rgba(255,255,255,.45)');}return o;};
  s+=`<g clip-path="url(#ctf)"><g class="outL">${topStr(-1)}</g><g class="outR">${topStr(1)}</g></g>`;
  s+=`<line x1="${c}" y1="${f(c)}" x2="${c+DX}" y2="${f(c)+DY}" stroke="#1f6fd1" stroke-width="3"/>`;
  s+=poly([[X0,SL],[X1,SL],[X1+DX,SL+DY],[X0+DX,SL+DY]],C.seaT,'opacity=".7"');
  s+=poly([[X0,SL],[X1,SL],[X1,YB],[X0,YB]],C.ast);
  s+=poly(cb.concat(lb.slice().reverse()),C.ml);
  s+=poly(sf.concat(cb.slice().reverse()),C.oc);
  s+=`<g clip-path="url(#clith)"><g clip-path="url(#cL)"><g class="outL">${stripes(-1,140,310,0)}</g></g><g clip-path="url(#cR)"><g class="outR">${stripes(1,140,310,0)}</g></g></g>`;
  s+=poly([[X0,SL],[X1,SL]].concat(sf.slice().reverse()),C.sea);
  s+=magma(c,f(c)+2);
  s+=`<path class="moho" d="${pth(cb)}"/>`;
  s+=sideBands(X1,[[SL,f(X1),C.sea],[f(X1),f(X1)+16,C.oc],[f(X1)+16,lab_(X1),C.ml],[lab_(X1),YB,C.ast]]);
  s+=arr(120,100,-1)+arr(420,100,1);
  let L='';
  L+=T(300,40,'Dorsal oceànica')+Ld(330,46,c+30,f(c)-20);
  L+=T(350,150,'Vall axial (rift)','sm')+Ld(348,147,c+2,f(c)+1);
  L+=T(60,150,'Escorça oceànica','sm')+Ld(110,154,120,f(120)+8);
  L+=T(420,f(420)+30,'Moho','sm');
  L+=T(70,240,'Mantell litosfèric');
  L+=T(70,328,'Astenosfera');
  L+=T(c+28,318,'Ascens de magma');
  L+=T(120,135,'Litosfera oceànica nova','sm')+Ld(200,139,c-8,f(c)+10);
  L+=T(300,372,'Les franges neixen a l\'eix i s\'allunyen: la litosfera creix cap als costats','sm','middle');
  L+=bracket(28,f(X0),lab_(X0),'Litosfera');
  return svgWrap(s,L);
}

/* ---------- 2. Del rift a la dorsal (3 etapes) ---------- */
function dRift(stage){
  let s='',L='';
  const c=270;
  // --- eina: blocs de l'escorça superior limitats per falles normals, amb estrats que es veuen desplaçats ---
  const K=0.55, Y0F=130;
  const fl=(x,d)=>y=>x+d*(y-Y0F)*K;
  const ST=['#efd9a8','#c99e63','#efd9a8','#c99e63'];
  function blocks(list,yb){ // list: [{l:fn,r:fn,yt}]
    let o='';
    for(const B of list){
      const bands=[[B.yt,B.yt+7,ST[0]],[B.yt+7,B.yt+14,ST[1]],[B.yt+14,B.yt+21,ST[2]],[B.yt+21,B.yt+28,ST[3]],[B.yt+28,yb,C.cc]];
      for(const [a,b,c] of bands){ if(a>=yb) continue; const bb=Math.min(b,yb);
        o+=poly([[B.l(a),a],[B.r(a),a],[B.r(bb),bb],[B.l(bb),bb]],c); }
    }
    return o;
  }
  function fault(fn,d,ya,yb,hang){ // hang: +1 si el bloc enfonsat és a la dreta
    let o=`<line x1="${fn(ya).toFixed(1)}" y1="${ya}" x2="${fn(yb).toFixed(1)}" y2="${yb}" stroke="#2f2210" stroke-width="2.6"/>`;
    const ym=ya+(yb-ya)*.5, n=Math.hypot(d*K,1), u=[d*K/n,1/n], nr=[u[1],-u[0]];
    const ha=(side,dir)=>{ const cx=fn(ym)+nr[0]*side*6, cy=ym+nr[1]*side*6, L=7;
      const a=[cx-u[0]*L*dir,cy-u[1]*L*dir], b=[cx+u[0]*L*dir,cy+u[1]*L*dir], h=[b[0]-u[0]*4*dir+nr[0]*side*3,b[1]-u[1]*4*dir+nr[1]*side*3];
      return `<path d="M${a}L${b}L${h}" stroke="#111" stroke-width="1.6" fill="none"/>`; };
    return o+ha(hang,1)+ha(-hang,-1);   // bloc enfonsat baixa, l'altre puja
  }
  const topProf=(list)=>{const p=[];for(const B of list){p.push([B.l(B.yt),B.yt],[B.r(B.yt),B.yt]);}return p;};
  if(stage===1){
    const F=[fl(170,1),fl(212,1),fl(328,-1),fl(370,-1)], YBR=196;
    const BL=[{l:()=>X0,r:F[0],yt:122},{l:F[0],r:F[1],yt:142},{l:F[1],r:F[2],yt:170},{l:F[2],r:F[3],yt:142},{l:F[3],r:()=>X1,yt:122}];
    const mo=samp(x=>222-16*g((x-c)/80),X0,X1), lb=samp(x=>292-75*g((x-c)/100),X0,X1);
    const LAKE=158, prof=topProf(BL);
    s+=topFace(prof,C.ccT);
    s+=poly([[F[1](LAKE),LAKE],[F[2](LAKE),LAKE],[F[2](LAKE)+DX,LAKE+DY],[F[1](LAKE)+DX,LAKE+DY]],C.seaT);
    s+=landOver(prof,LAKE,C.ccT);
    s+=astFrom(lb);
    s+=poly(mo.concat(lb.slice().reverse()),C.ml);
    s+=poly([[X0,YBR],[X1,YBR]].concat(mo.slice().reverse()),'#dcc08b');
    s+=blocks(BL,YBR);
    // sediments i llac al graben
    s+=poly([[F[1](170),170],[F[2](170),170],[F[2](164),164],[F[1](164),164]],'#f3e6b5','stroke="#c9b77a" stroke-width=".6"');
    s+=poly([[F[1](164),164],[F[2](164),164],[F[2](LAKE),LAKE],[F[1](LAKE),LAKE]],C.sea);
    s+=fault(F[0],1,122,YBR,1)+fault(F[1],1,142,YBR,1)+fault(F[2],-1,142,YBR,-1)+fault(F[3],-1,122,YBR,-1);
    s+=magma(c,224,YB,18);
    s+=`<path class="moho" d="${pth(mo)}"/>`;
    s+=sideBands(X1,[[122,YBR,C.cc],[YBR,222,'#dcc08b'],[222,292,C.ml],[292,YB,C.ast]]);
    s+=arr(100,92,-1)+arr(430,92,1);
    L+=T(c,34,'Vall de rift (graben)','','middle')+Ld(c,40,c+20,LAKE-4);
    L+=T(c+80,108,'Llac','sm')+Ld(c+78,111,c+40,LAKE+3);
    L+=T(80,58,'Horst')+Ld(100,62,130,120);
    L+=T(480,58,'Horst','','middle')+Ld(478,62,455,118);
    L+=T(420,248,'Falles normals','sm','middle')+Ld(420,240,F[3](182)+2,182)+Ld(420,240,F[2](182)+2,182);
    L+=T(52,160,'Escorça continental','sm');
    L+=T(52,212,'Escorça inferior (dúctil)','sm');
    L+=T(470,236,'Moho','sm');
    L+=T(52,258,'Mantell litosfèric');
    L+=T(52,330,'Astenosfera');
    L+=T(c+26,312,'Ascens de magma i aixecament','sm');
  } else if(stage===2){
    const SL=138, YBR=178;
    const FL=[fl(165,1),fl(200,1),fl(232,1)], FR=[fl(308,-1),fl(340,-1),fl(375,-1)];
    const BLL=[{l:()=>X0,r:FL[0],yt:124},{l:FL[0],r:FL[1],yt:136},{l:FL[1],r:FL[2],yt:152}];
    const BLR=[{l:FR[0],r:FR[1],yt:152},{l:FR[1],r:FR[2],yt:136},{l:FR[2],r:()=>X1,yt:124}];
    const ocL=FL[2](168), ocR=FR[0](168);
    const mo=x=>{const d=Math.abs(x-c); if(d<=45) return 182; if(d<=130) return 182+(d-45)/85*24; return 206;};
    const mop=samp(mo,X0,X1,4), lb=samp(x=>292-95*g((x-c)/100),X0,X1);
    const floor=samp(x=>168-6*g((x-c)/10),ocL,ocR,3);
    const prof=topProf(BLL).concat(floor).concat(topProf(BLR));
    s+=topFace(prof,C.ccT);
    s+=topFace(floor,C.ocT);
    s+=poly([[FL[0](SL),SL],[FR[2](SL),SL],[FR[2](SL)+DX,SL+DY],[FL[0](SL)+DX,SL+DY]],C.seaT,'opacity=".8"');
    s+=landOver(prof,SL,C.ccT);
    s+=astFrom(lb);
    s+=poly(mop.concat(lb.slice().reverse()),C.ml);
    s+=poly([[X0,YBR],[ocL,YBR]].concat(mop.filter(p=>p[0]<=ocL).reverse()),'#dcc08b');
    s+=poly([[ocR,YBR],[X1,YBR]].concat(mop.filter(p=>p[0]>=ocR).reverse()),'#dcc08b');
    s+=poly([[FL[0](SL),SL],[FR[2](SL),SL],[FR[2](SL),172],[FL[0](SL),172]],C.sea);
    s+=blocks(BLL,YBR)+blocks(BLR,YBR);
    s+=poly(floor.concat(floor.slice().reverse().map(([x,y])=>[x,182])),C.oc);
    s+=fault(FL[0],1,124,YBR,1)+fault(FL[1],1,136,YBR,1)+fault(FL[2],1,152,YBR,1);
    s+=fault(FR[0],-1,152,YBR,-1)+fault(FR[1],-1,136,YBR,-1)+fault(FR[2],-1,124,YBR,-1);
    s+=magma(c,170,YB,18);
    s+=`<path class="moho" d="${pth(mop)}"/>`;
    s+=sideBands(X1,[[124,YBR,C.cc],[YBR,206,'#dcc08b'],[206,292,C.ml],[292,YB,C.ast]]);
    s+=arr(100,90,-1)+arr(430,90,1);
    L+=T(c,34,'Nou oceà estret','','middle')+Ld(c,40,c+22,SL-6);
    L+=T(c+40,214,'Escorça oceànica nova','sm','start')+Ld(c+38,210,c+12,176);
    L+=T(52,150,'Escorça continental','sm');
    L+=T(392,96,'Blocs enfonsats per falles normals','sm','middle')+Ld(392,100,FR[1](150),146);
    L+=T(440,224,'Moho','sm');
    L+=T(52,258,'Mantell litosfèric');
    L+=T(52,330,'Astenosfera');
    L+=T(c+26,312,'Ascens de magma','sm');
  } else {
    const SL=132;
    const rf=x=>185-34*g((x-c)/60)+7*g((x-c)/7);
    const f=x=>{ const d=Math.abs(x-c), xs=c-d; // simètric
      if(xs<=110) return 124; if(xs<=150) return 138; if(xs<=190) return 138+(xs-150)/40*(rf(190)-138); return rf(xs); };
    const sf=samp(f,X0,X1,4);
    const mo=x=>{const d=Math.abs(x-c), xs=c-d; if(xs<=150) return 205; if(xs<=200) return 205+(xs-150)/50*(rf(200)+16-205); return rf(xs)+16;};
    const mop=samp(mo,X0,X1,4);
    const lb=samp(x=>300-110*g((x-c)/95),X0,X1);
    s+=topFace(sf,C.ocT);
    s+=`<line x1="${c}" y1="${f(c)}" x2="${c+DX}" y2="${f(c)+DY}" stroke="#1f6fd1" stroke-width="3"/>`;
    s+=poly([[X0,SL],[X1,SL],[X1+DX,SL+DY],[X0+DX,SL+DY]],C.seaT,'opacity=".7"');
    s+=landOver(sf,SL,C.ccT);
    s+=astFrom(lb);
    s+=poly(mop.concat(lb.slice().reverse()),C.ml);
    const oc=sf.filter(p=>p[0]>=190&&p[0]<=350);
    s+=poly(oc.concat(oc.slice().reverse().map(([x,y])=>[x,y+16])),C.oc);
    const lc=sf.filter(p=>p[0]<=200), rc=sf.filter(p=>p[0]>=340);
    s+=poly(lc.concat(lc.slice().reverse().map(([x])=>[x,mo(x)])),C.cc);
    s+=poly(rc.concat(rc.slice().reverse().map(([x])=>[x,mo(x)])),C.cc);
    s+=poly([[110,SL],[430,SL]].concat(sf.filter(p=>p[0]>=110&&p[0]<=430).reverse()),C.sea);
    s+=magma(c,f(c)+2,YB,18);
    s+=`<path class="moho" d="${pth(mop)}"/>`;
    s+=sideBands(X1,[[124,205,C.cc],[205,300,C.ml],[300,YB,C.ast]]);
    s+=arr(60,92,-1,40)+arr(440,92,1,40);
    L+=T(c,36,'Dorsal oceànica','','middle')+Ld(c,42,c+30,f(c)-20);
    L+=T(70,60,'Plataforma continental','sm')+Ld(100,64,130,134);
    L+=T(390,60,'Plataforma continental','sm')+Ld(430,64,410,134);
    L+=T(210,170,'Escorça oceànica','sm')+Ld(240,174,235,f(235)+8);
    L+=T(48,168,'Escorça continental','sm');
    L+=T(440,218,'Moho','sm');
    L+=T(60,262,'Mantell litosfèric');
    L+=T(60,332,'Astenosfera');
  }
  return svgWrap(s,L);
}

function dOcCont(){
  const SL=120;
  const ocean=[[40,175],[215,178],[250,205]];

  const moho=[[500,190],[440,205],[400,232],[380,234],[350,215],[310,200],[275,210],[262,212]];
  let s='';
  s+=topFace(ocean,C.ocT)+topFace(cont,C.ccT);

function dTransf(){
  const FL=[40,300],FR=[500,300],BL=[100,90];
  const Q=(u,v)=>[FL[0]+u*(FR[0]-FL[0])+v*(BL[0]-FL[0]), FL[1]+v*(BL[1]-FL[1])];
  const BR=Q(1,1);
  let s='';
  s+=poly([Q(0,0),Q(1,0),Q(1,1),Q(0,1)],C.ocT,'stroke="rgba(0,0,0,.3)"');
  // franges d'edat (escorça més jove a prop de les dorsals)
  for(const [ua,vb,va] of [[.38,1,.5],[.62,.5,0]]){
    for(const k of [.06,.13]){
      s+=`<path d="${pth([Q(ua-k,va),Q(ua-k,vb)])}" stroke="rgba(255,255,255,.35)" stroke-width="5"/>`;
      s+=`<path d="${pth([Q(ua+k,va),Q(ua+k,vb)])}" stroke="rgba(255,255,255,.35)" stroke-width="5"/>`;
    }
  }
  s+=poly([Q(0,0),Q(1,0),[FR[0],350],[FL[0],350]],C.ml)+poly([Q(0,0),Q(1,0),[FR[0],318],[FL[0],318]],C.oc);
  s+=poly([Q(1,0),Q(1,1),[BR[0],BR[1]+50],[FR[0],350]],C.ml)+poly([Q(1,0),Q(1,1),[BR[0],BR[1]+18],[FR[0],318]],C.oc)+poly([Q(1,0),Q(1,1),[BR[0],BR[1]+50],[FR[0],350]],C.shade);
  s+=`<line x1="${FL[0]}" y1="318" x2="${FR[0]}" y2="318" class="moho"/>`;
  // zones de fractura
  s+=`<path d="${pth([Q(0,.5),Q(.38,.5)])}" stroke="#7aa883" stroke-width="3" stroke-dasharray="9 6"/>`;
  s+=`<path d="${pth([Q(.62,.5),Q(1,.5)])}" stroke="#7aa883" stroke-width="3" stroke-dasharray="9 6"/>`;
  // falla activa
  s+=`<path d="${pth([Q(.38,.5),Q(.62,.5)])}" stroke="#46b85a" stroke-width="6"/>`;
  // dorsals
  for(const [u,v0,v1] of [[.38,.5,1],[.62,0,.5]]){
    s+=`<path d="${pth([Q(u,v0),Q(u,v1)])}" stroke="#1f6fd1" stroke-width="8"/><path d="${pth([Q(u,v0),Q(u,v1)])}" stroke="#fff" stroke-width="2.5"/>`;
  }
  // terratrèmols
  const star=(x,y)=>`<path class="pul" d="M${x},${y-9}L${x+3},${y-3}L${x+9},${y-3}L${x+4},${y+1}L${x+6},${y+8}L${x},${y+4}L${x-6},${y+8}L${x-4},${y+1}L${x-9},${y-3}L${x-3},${y-3}Z" fill="#ffd23f" stroke="#111" stroke-width="1"/>`;
  for(const u of [.45,.5,.55]){const p=Q(u,.5);s+=star(p[0],p[1]);}
  // fletxes
  const A=(u,v,d)=>{const p=Q(u,v);return arr(p[0]-d*20,p[1],d,40);};
  s+=A(.18,.75,-1)+A(.5,.75,1)+A(.84,.75,1);
  s+=A(.16,.25,-1)+A(.5,.25,-1)+A(.84,.25,1);
  let L='';
  const q1=Q(.38,.92), q2=Q(.62,.08), qa=Q(.5,.5), qf1=Q(.16,.5), qf2=Q(.86,.5);
  L+=T(q1[0]-30,40,'Dorsal','','end')+Ld(q1[0]-28,44,q1[0],q1[1]);
  {const qb=Q(.62,0); L+=T(qb[0],372,'Dorsal','','middle')+Ld(qb[0],360,qb[0],qb[1]+4);}
  L+=T(qa[0],qa[1]-22,'Falla transformant (activa)','','middle');
  L+=T(qa[0],qa[1]+30,'sentits oposats · terratrèmols','sm','middle');
  L+=T(qf1[0],qf1[1]-12,'Zona de fractura (inactiva)','sm','middle');
  L+=T(qf2[0],qf2[1]+22,'Zona de fractura (inactiva)','sm','middle');
  L+=T(FL[0]+10,313,'Escorça oceànica','w sm');
  L+=T(FR[0]-10,330,'Moho','sm','end');
  return svgWrap(s,L);
}

let hotRaf=null, hotTime=80, hotLast=null;
function stopHot(){ if(hotRaf) cancelAnimationFrame(hotRaf); hotRaf=null; hotLast=null; }
function startHot(svg){
  stopHot();
  const gV=svg.querySelector('#hvolc'), gS=svg.querySelector('#hstripes'), gA=svg.querySelector('#hact'), cd=svg.querySelector('#hconduit');
  const {fl,SL,px,v,T,top}=HOT, Hmax=fl-top;
  const draw=()=>{
    gS.setAttribute('transform',`translate(${-((v*hotTime)%45)},0)`);
    const n0=Math.floor(hotTime/T);
    let out='', act=0, ax=px, at=fl-4;
    for(let n=n0; n>=n0-8; n--){
      const a=hotTime-n*T; if(a<0) continue;
      const x=px-v*a; if(x<X0-60) break;
      let h;
      if(a<T*0.55) h=Hmax*Math.min(1,a/(T*0.55));            // creix sobre el punt calent
      else if(a<T) h=Hmax;                                     // actiu
      else h=Hmax;                                             // s'apaga i manté la mida
      const tp=fl-h, w=10+h*0.42, alive=a<T;
      if(alive){ ax=x; at=tp; if(a>T*0.45) act=1; }
      out+=poly([[x-w,fl],[x-3,tp],[x+3,tp],[x+w,fl]],alive?'#4b4f55':'#666b71');
      out+=poly([[x+3,tp],[x+w,fl],[x+w*.35,fl]],'rgba(0,0,0,.22)');
      if(!alive && tp<SL) out+=poly([[x-w*.55,SL],[x-w*.25,SL-Math.min(10,(SL-tp)*.4)],[x+w*.1,SL-Math.min(8,(SL-tp)*.3)],[x+w*.55,SL]],'rgba(90,140,70,.6)');
      if(alive) out+=`<ellipse cx="${x}" cy="${tp}" rx="5" ry="2.5" fill="${C.mag}"/>`;
    }
    gV.innerHTML=out;
    gA.style.display=act?'':'none'; gA.setAttribute('transform',`translate(${(ax-px).toFixed(1)},0)`);
    cd.setAttribute('d',`M376,264 C378,230 ${(px+ax)/2-2},200 ${ax.toFixed(1)},${(at+4).toFixed(1)} C${(px+ax)/2+4},200 386,230 388,264Z`);
  };
  const step=(ts)=>{
    if(hotLast!==null && playing) hotTime+=Math.min(.1,(ts-hotLast)/1000);
    hotLast=ts; draw(); hotRaf=requestAnimationFrame(step);
  };
  draw(); hotRaf=requestAnimationFrame(step);
}

const lnav=document.getElementById('lnav'), ltext=document.getElementById('ltext'), dframe=document.getElementById('dframe'), dst=document.getElementById('d-stages');
let curBlock='dorsal', curStage=1, playing=true, labs=true;
(function(){
  let lastG='';
  for(const id in BLOCKS){
    const B=BLOCKS[id];
    if(B.grp!==lastG){lnav.insertAdjacentHTML('beforeend',`<div class="grp">${B.grp}</div>`);lastG=B.grp;}
    lnav.insertAdjacentHTML('beforeend',`<button data-b="${id}" style="border-left-color:${B.col}">${B.name}</button>`);
  }
  lnav.querySelectorAll('button').forEach(b=>b.onclick=()=>selBlock(b.dataset.b));
})();
function renderDiag(){
  const B=BLOCKS[curBlock];
  dframe.innerHTML = B.stages? B.fn(curStage) : B.fn();
  dframe.style.borderColor=B.col;
  const svg=dframe.querySelector('svg');
  svg.classList.toggle('paused',!playing); svg.classList.toggle('nolab',!labs);
  if(curBlock==='hot') startHot(svg); else stopHot();
}
function selBlock(id){
  curBlock=id; curStage=1;
  lnav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.b===id));
  const B=BLOCKS[id]; ltext.innerHTML=B.html;
  dst.innerHTML = B.stages? B.stages.map((s,i)=>`<button class="chip${i===0?' on':''}" data-s="${i+1}">${s}</button>`).join('') : '';
  dst.querySelectorAll('button').forEach(b=>b.onclick=()=>{curStage=+b.dataset.s;dst.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderDiag();});
  renderDiag();
}
const dPlay=document.getElementById('d-play'), dLab=document.getElementById('d-lab');
dPlay.onclick=()=>{playing=!playing;dPlay.textContent=playing?'❚❚ Atura':'▶ Mou';dPlay.classList.toggle('on',playing);renderDiag();};
dLab.onclick=()=>{labs=!labs;dLab.classList.toggle('on',labs);renderDiag();};
function goBlock(id){ showTab('t-limits'); selBlock(id); }
selBlock('dorsal');
